[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "frontierguard-dea"
version = "0.1.0a0"
description = "A rigorous, extensible Data Envelopment Analysis toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vamsi Chinda" },
]
maintainers = [
  { name = "Vamsi Chinda" },
]
keywords = [
  "benchmarking",
  "data-envelopment-analysis",
  "dea",
  "efficiency",
  "operations-research",
  "productivity",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.11",
]

[project.scripts]
frontierguard = "frontierguard.cli:main"

[project.urls]
Changelog = "https://github.com/chindavamsi/frontierguard-dea/blob/main/CHANGELOG.md"
Documentation = "https://github.com/chindavamsi/frontierguard-dea#readme"
Homepage = "https://github.com/chindavamsi/frontierguard-dea"
Issues = "https://github.com/chindavamsi/frontierguard-dea/issues"
Repository = "https://github.com/chindavamsi/frontierguard-dea"

[project.optional-dependencies]
highs = ["highspy>=1.11,<2"]
parallel = ["joblib>=1.3"]
plot = ["matplotlib>=3.8"]
report = ["jinja2>=3.1"]

[dependency-groups]
dev = [
  "highspy>=1.11,<2",
  "hypothesis>=6.125",
  "mypy>=1.14",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/frontierguard"]

[tool.hatch.build.targets.sdist]
exclude = ["/.hypothesis", "/.hypothesis/**"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["frontierguard"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "PTH",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["frontierguard"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true
