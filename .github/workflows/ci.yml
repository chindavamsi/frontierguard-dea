name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.16"

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy

      - name: Validate scholarly release metadata
        run: |
          uv run --frozen python scripts/validate_release_metadata.py
          uvx --from cffconvert==2.0.0 cffconvert --validate

      - name: Validate conformance benchmark
        run: |
          benchmark_results="$(mktemp -d)"
          uv run --frozen python benchmarks/scripts/validate_assets.py
          uv run --frozen python benchmarks/scripts/run_frontierguard.py \
            --output-dir "$benchmark_results"
          uv run --frozen python benchmarks/scripts/validate_results.py \
            --results-dir "$benchmark_results"

      - name: Render the technical white paper
        run: >-
          uv run --frozen python scripts/render_whitepaper_pdf.py
          --output "${{ runner.temp }}/frontierguard-dea-white-paper-v0.1.pdf"

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
          cache-suffix: py${{ matrix.python-version }}

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run test suite
        run: >-
          uv run --frozen pytest
          --cov=frontierguard
          --cov-report=term-missing
          --cov-report=xml

  package:
    name: Build and inspect distributions
    needs:
      - quality
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel and source distribution
        run: uv build --no-sources --clear

      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Verify wheel in a clean environment
        run: |
          uv venv .package-check --python 3.12
          uv pip install --python .package-check/bin/python dist/*.whl
          .package-check/bin/python - <<'PY'
          from importlib.metadata import metadata, version

          import frontierguard

          assert version("frontierguard-dea") == frontierguard.__version__
          package = metadata("frontierguard-dea")
          assert package["Author"] == "Vamsi Chinda"
          assert package["License-Expression"] == "MIT"
          print(f"validated frontierguard-dea {frontierguard.__version__}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
