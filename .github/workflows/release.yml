name: Publish release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.16"
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Verify release tag and package version
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = metadata["project"]["version"]
          expected_tag = f"v{version}"
          actual_tag = os.environ["RELEASE_TAG"]

          version_text = pathlib.Path("src/frontierguard/_version.py").read_text()
          init_match = re.search(
              r'^__version__ = "([^"]+)"$', version_text, re.MULTILINE
          )
          citation_text = pathlib.Path("CITATION.cff").read_text()
          citation_match = re.search(
              r"^version:\s*[\"']?([^\"'\s]+)", citation_text, re.MULTILINE
          )
          changelog_text = pathlib.Path("CHANGELOG.md").read_text()

          errors = []
          if actual_tag != expected_tag:
              errors.append(
                  f"release tag {actual_tag!r} does not match {expected_tag!r}"
              )
          if init_match is None or init_match.group(1) != version:
              errors.append("frontierguard._version does not match project.version")
          if citation_match is None or citation_match.group(1) != version:
              errors.append("CITATION.cff version does not match project.version")
          if f"## [{version}]" not in changelog_text:
              errors.append(f"CHANGELOG.md has no release section for {version}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"validated release {actual_tag}")
          PY

      - name: Run release gates
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy
          uv run --frozen python scripts/validate_release_metadata.py
          uvx --from cffconvert==2.0.0 cffconvert --validate
          benchmark_results="$(mktemp -d)"
          uv run --frozen python benchmarks/scripts/validate_assets.py
          uv run --frozen python benchmarks/scripts/run_frontierguard.py \
            --output-dir "$benchmark_results"
          uv run --frozen python benchmarks/scripts/validate_results.py \
            --results-dir "$benchmark_results"
          uv run --frozen python scripts/render_whitepaper_pdf.py \
            --output "${{ runner.temp }}/frontierguard-dea-white-paper-v0.1.pdf"
          uv run --frozen pytest --cov=frontierguard --cov-report=term-missing

      - name: Build wheel and source distribution
        run: uv build --no-sources --clear

      - name: Validate package metadata
        run: uvx --from twine==7.0.0 twine check --strict dist/*

      - name: Upload distributions for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish signed distributions
    needs:
      - build
    if: github.repository == 'chindavamsi/frontierguard-dea'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/frontierguard-dea/
    permissions:
      attestations: write  # Create GitHub build-provenance attestations.
      contents: write  # Attach distributions to the GitHub Release.
      id-token: write  # Authenticate to PyPI through trusted publishing.

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-distributions
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: dist/*

      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG" dist/* --clobber
          --repo "$GITHUB_REPOSITORY"

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
        with:
          packages-dir: dist/
          print-hash: true
          verbose: true
